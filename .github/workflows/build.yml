name: Build Luma APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # The signing key lives only in the Actions cache (never in the repo), so later builds
      # keep the same signature and install over the previous one.
      - name: Restore signing key
        id: keystore
        uses: actions/cache@v4
        with:
          path: app/luma-release.jks
          key: luma-signing-key-v1

      - name: Create signing key
        if: steps.keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -keystore app/luma-release.jks -alias luma \
            -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "luma-ci-signing" -keypass "luma-ci-signing" \
            -dname "CN=Luma Caller"

      - name: Build release APK
        env:
          LUMA_KEYSTORE_PASSWORD: luma-ci-signing
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon 2>&1 | tee build.log

      - name: Summarise build errors
        if: failure()
        run: |
          {
            grep -E "^e: |^w: .*error|error:|AAPT|What went wrong|Execution failed|Caused by" -A2 build.log | head -90
          } > errors.txt || true
          msg=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' errors.txt)
          echo "::error title=Build errors::${msg}"

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk Luma.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Luma-apk
          path: Luma.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Luma.apk \
            --title "Luma (latest build)" \
            --notes "Signed release APK built from commit ${GITHUB_SHA::7}. Install it on your phone, then set Luma as the default phone and messages app." \
            --target "$GITHUB_SHA"

          VERSION=$(grep -oP 'versionName = "\K[0-9]+\.[0-9]+' app/build.gradle.kts)
          gh release delete "v$VERSION" --yes --cleanup-tag || true
          gh release create "v$VERSION" Luma.apk \
            --title "Luma $VERSION" \
            --notes "Luma $VERSION - signed release APK (commit ${GITHUB_SHA::7})." \
            --target "$GITHUB_SHA"
